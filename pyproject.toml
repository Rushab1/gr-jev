[project]
name = "grjev"
version = "0.1.0"
description = "Study of Jev, TypeSafe AI's decision model, as a tool and action selector"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==2.1.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grjev"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
